[package]
name = "pulseroute-backend"
version = "1.0.0"
edition = "2021"
authors = ["PulseRoute Engineering Team"]
description = "High-performance Rust backend for PulseRoute team management, integrated with Supabase and Vercel."
license = "MIT"

[lib]
name = "pulseroute_backend"
path = "src/lib.rs"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
# Async Runtime & Web Framework
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["multipart", "macros"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs", "compression-full"] }

# Serialization & Data
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# HTTP Client for Supabase PostgREST & Storage API
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }

# Environment & Configuration
dotenvy = "0.15"

# Error Handling & Validation
thiserror = "1.0"
validator = { version = "0.18", features = ["derive"] }

# Tracing & Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# OpenAPI / Swagger Documentation
utoipa = { version = "4.2", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "7.1", features = ["axum"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
